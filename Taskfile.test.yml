version: "3"

vars:
  CLUSTER_PROFILE:
    sh: . test/e2e/cluster/profile.sh && echo "$CLUSTER_PROFILE"
  CLUSTER_ENGINE:
    sh: . test/e2e/cluster/profile.sh && echo "$CLUSTER_ENGINE"
  CLUSTER_LOCATION:
    sh: . test/e2e/cluster/profile.sh && echo "$CLUSTER_LOCATION"
  REGISTRY_HOST:
    sh: . test/e2e/cluster/profile.sh && echo "$REGISTRY_HOST"
  IMAGE_TAG:
    sh: . test/e2e/cluster/profile.sh && echo "$IMAGE_TAG"
  IMAGE_PLATFORM:
    sh: . test/e2e/cluster/profile.sh && echo "$IMAGE_PLATFORM"
  KUBECONFIG:
    sh: . test/e2e/cluster/profile.sh && echo "$KUBECONFIG"
  K3S_SSH_HOST:
    sh: . test/e2e/cluster/profile.sh && echo "${K3S_SSH_HOST:-}"
  K3S_REGISTRY_PORT:
    sh: . test/e2e/cluster/profile.sh && echo "${K3S_REGISTRY_PORT:-5001}"
  KIND_CLUSTER_NAME:
    sh: . test/e2e/cluster/profile.sh && echo "${KIND_CLUSTER_NAME:-oksg-test}"
  KIND_REGISTRY_NAME:
    sh: . test/e2e/cluster/profile.sh && echo "${KIND_REGISTRY_NAME:-oksg-kind-registry}"
  KIND_REGISTRY_PORT:
    sh: . test/e2e/cluster/profile.sh && echo "${KIND_REGISTRY_PORT:-5001}"
  KIND_NAMESPACE: oksg-system
  HELM_RELEASE_NAME: oksg-otel
  HELM_CHART_PATH: ./deploy/helm/oksg-otel
  TARGET_NAMESPACE: oksg-demo
  SPARSE_NAMESPACE: oksg-sparse
  BACKEND_IMAGE_REPOSITORY: '{{.REGISTRY_HOST}}/oksg-backend'
  BACKEND_IMAGE_TAG: '{{.IMAGE_TAG}}'
  BACKEND_IMAGE_PULL_POLICY: Always
  FRONTEND_IMAGE_REPOSITORY: '{{.REGISTRY_HOST}}/oksg-frontend'
  FRONTEND_IMAGE_TAG: '{{.IMAGE_TAG}}'
  FRONTEND_IMAGE_PULL_POLICY: Always
  E2E_OUTPUT_DIR: ./bin/e2e
  PROFILE_PATH: ./bin/e2e/profile.json
  VALUES_PATH: ./bin/e2e/otel-values.yaml
  RENDERED_PATH: ./bin/e2e/rendered
  DISCOVERY_JOB_BIN: ./bin/discovery-job
  BACKEND_HEALTH_PORT: "13133"
  BACKEND_API_LOCAL_PORT: "18081"
  GATEWAY_LOCAL_PORT: "18080"
  TRAFFIC_REQUESTS_DEFAULT: "20"
  TRAFFIC_ERROR_REQUESTS_DEFAULT: "0"
  TRAFFIC_ERROR_EVERY_DEFAULT: "5"
  TRAFFIC_INTERVAL_DEFAULT: "0.5"

env:
  KUBECONFIG: '{{.KUBECONFIG}}'

tasks:
  e2e:setup:
    desc: Provision the cluster for the active CLUSTER_PROFILE (kind+local default; k3s+ssh for remote)
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - |
        case "{{.CLUSTER_ENGINE}}" in
          kind) ./test/e2e/kind/setup.sh {{.KIND_CLUSTER_NAME}} ;;
          k3s)  ./test/e2e/cluster/k3s/setup.sh ;;
          *)    echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2; exit 1 ;;
        esac

  e2e:teardown:
    desc: Tear down the cluster (kind) or OKSG resources on it (k3s)
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          kind) ./test/e2e/kind/teardown.sh {{.KIND_CLUSTER_NAME}} ;;
          k3s)  ./test/e2e/cluster/k3s/teardown.sh ;;
          *)    echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2; exit 1 ;;
        esac

  e2e:deploy:
    desc: "Build and deploy test apps to cluster (set VARIANT env var; defaults to base. Accepts: base, with-prometheus, with-istio)"
    cmds:
      # VARIANT is read from the shell env (no Task-CLI-var form). CLI users
      # pass it as an env-var prefix, e.g. `VARIANT=with-prometheus task test:e2e:deploy`.
      - ./test/e2e/apps/deploy.sh "${VARIANT:-base}"

  e2e:install-istio:
    desc: Install minimal Istio control plane for mesh telemetry e2e scenarios
    deps: [e2e:ensure-cluster]
    cmds:
      - |
        if kubectl get namespace istio-system >/dev/null 2>&1; then
          echo "istio-system already exists; skipping istioctl install"
        else
          istioctl install --set profile=minimal -y
        fi

  e2e:ensure-build:
    desc: Build discovery-job into bin/ so e2e never creates binaries in repo root
    cmds:
      - mkdir -p bin
      - go build -o ./bin/discovery-job ./cmd/discovery-job

  e2e:discover:
    desc: Run Kubernetes discovery against the cluster
    deps: [e2e:ensure-build]
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - "{{.DISCOVERY_JOB_BIN}} --mode=discover --kubeconfig={{.KUBECONFIG}} --cluster-name={{.CLUSTER_PROFILE}} --output={{.PROFILE_PATH}} --namespace={{.KIND_NAMESPACE}} --target-namespace={{.TARGET_NAMESPACE}}"

  e2e:plan:
    desc: Generate Helm values from discovery output
    deps: [e2e:ensure-build]
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - "{{.DISCOVERY_JOB_BIN}} --mode=plan --capability-profile={{.PROFILE_PATH}} --values-output={{.VALUES_PATH}} --rendered-output={{.RENDERED_PATH}} --namespace={{.KIND_NAMESPACE}} --chart-path={{.HELM_CHART_PATH}} --release-name={{.HELM_RELEASE_NAME}} --backend-image-repository={{.BACKEND_IMAGE_REPOSITORY}} --backend-image-tag={{.BACKEND_IMAGE_TAG}} --backend-image-pull-policy={{.BACKEND_IMAGE_PULL_POLICY}}"

  e2e:apply-source-contract:
    desc: Create or update the capability profile and resolved source-plan ConfigMap for backend validation
    cmds:
      - >-
        kubectl create configmap oksg-source-contract
        --from-file=capability-profile.json={{.PROFILE_PATH}}
        --from-file=source-plan.json={{.VALUES_PATH}}.source-plan.json
        -n {{.KIND_NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -

  e2e:apply-otel:
    desc: Install or upgrade the OTel Helm release with generated values and external storage
    cmds:
      - helm dependency build {{.HELM_CHART_PATH}}
      - >-
        helm upgrade --install {{.HELM_RELEASE_NAME}} {{.HELM_CHART_PATH}}
        --namespace {{.KIND_NAMESPACE}} --create-namespace
        -f {{.VALUES_PATH}}
        --set storage.backend=external
        --set storage.postgresql.enabled=true
        --set storage.victoriametrics.enabled=true
        --set postgresql.auth.password=oksg
        --set frontend.image.repository={{.FRONTEND_IMAGE_REPOSITORY}}
        --set frontend.image.tag={{.FRONTEND_IMAGE_TAG}}
        --set frontend.image.pullPolicy={{.FRONTEND_IMAGE_PULL_POLICY}}
      - kubectl rollout restart deployment/oksg-backend -n {{.KIND_NAMESPACE}}
      - kubectl rollout restart deployment/oksg-frontend -n {{.KIND_NAMESPACE}}

  e2e:verify:
    desc: Verify generated collectors and storage backends are deployed
    cmds:
      - helm status {{.HELM_RELEASE_NAME}} -n {{.KIND_NAMESPACE}}
      - kubectl get pods -n {{.KIND_NAMESPACE}}
      - echo "Waiting for storage backends..."
      - kubectl rollout status statefulset/{{.HELM_RELEASE_NAME}}-postgresql -n {{.KIND_NAMESPACE}} --timeout=180s
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=victoria-metrics-single -n {{.KIND_NAMESPACE}} --timeout=180s
      - echo "Waiting for collector rollouts..."
      - kubectl rollout status deployment/oksg-backend -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl rollout status deployment/oksg-frontend -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl rollout status deployment/otel-collector-gateway -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl rollout status daemonset/otel-collector-agent -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl logs -n {{.KIND_NAMESPACE}} daemonset/otel-collector-agent --tail=30
      - kubectl logs -n {{.KIND_NAMESPACE}} deployment/otel-collector-gateway --tail=30
      - kubectl logs -n {{.KIND_NAMESPACE}} deployment/oksg-backend --tail=30

  e2e:reset:
    desc: Remove deployed OTel Helm release
    cmds:
      - helm uninstall {{.HELM_RELEASE_NAME}} --namespace {{.KIND_NAMESPACE}} || true
      - kubectl delete configmap oksg-source-contract -n {{.KIND_NAMESPACE}} --ignore-not-found

  e2e:reset-apps:
    desc: Remove deployed demo fixtures across all e2e app namespaces
    cmds:
      - kubectl delete namespace {{.TARGET_NAMESPACE}} --ignore-not-found
      - kubectl delete namespace {{.SPARSE_NAMESPACE}} --ignore-not-found

  e2e:reset-all:
    desc: Remove both OTel collectors and all deployed demo fixtures
    cmds:
      - task: e2e:reset
      - task: e2e:reset-apps

  e2e:ensure-cluster:
    desc: Verify the active cluster is reachable and ready (engine-aware)
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          kind)
            if ! kind get clusters 2>/dev/null | grep -qx "{{.KIND_CLUSTER_NAME}}"; then
              echo "Cluster not found. Run 'task test:e2e:setup' first."
              exit 1
            fi
            if ! docker inspect -f '{{`{{.State.Running}}`}}' {{.KIND_REGISTRY_NAME}} 2>/dev/null | grep -q true; then
              echo "Registry not running. Run 'task test:e2e:setup' first."
              exit 1
            fi
            ;;
          k3s)
            if ! kubectl --kubeconfig "{{.KUBECONFIG}}" get nodes >/dev/null 2>&1; then
              echo "kubectl cannot reach the cluster (KUBECONFIG={{.KUBECONFIG}}). Run 'task test:e2e:setup' and 'task test:cluster:doctor'."
              exit 1
            fi
            if ! ssh -o BatchMode=yes -o ConnectTimeout=5 "{{.K3S_SSH_HOST}}" curl -fsS --max-time 5 http://127.0.0.1:{{.K3S_REGISTRY_PORT}}/v2/ >/dev/null 2>&1; then
              echo "remote registry is not reachable from the k3s server at 127.0.0.1:{{.K3S_REGISTRY_PORT}}. Run 'task test:e2e:setup' and 'task test:cluster:doctor'."
              exit 1
            fi
            ;;
          *)
            echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2
            exit 1
            ;;
        esac
    silent: true

  e2e:scenario:prometheus:prepare:
    desc: Prepare the Prometheus discovery scenario without generating traffic
    deps: [e2e:ensure-cluster]
    cmds:
      - ./test/e2e/apps/deploy.sh with-prometheus
      - task: e2e:discover
      - task: e2e:plan
      - task: e2e:apply-otel
      - task: e2e:apply-source-contract
      - task: e2e:verify

  e2e:scenario:prometheus:
    desc: Run Prometheus discovery scenario with gateway traffic (full pipeline including servicegraph)
    cmds:
      - ./test/e2e/scenarios/prometheus-available/run.sh

  e2e:scenario:istio:prepare:
    desc: Prepare the Istio mesh telemetry scenario and generate gateway traffic
    deps: [e2e:ensure-cluster]
    cmds:
      - task: e2e:install-istio
      - ./test/e2e/apps/deploy.sh with-istio
      - task: e2e:discover
      - task: e2e:plan
      - task: e2e:apply-otel
      - task: e2e:apply-source-contract
      - task: e2e:verify
      - task: e2e:traffic
        vars:
          TRAFFIC_REQUESTS: "30"
          TRAFFIC_ERROR_REQUESTS: "10"
          TRAFFIC_INTERVAL: "0.2"

  e2e:scenario:istio:
    desc: Run the full Istio mesh accuracy scenario, including deterministic gRPC and TCP verification
    cmds:
      - ./test/e2e/scenarios/istio-available/run.sh

  e2e:scenario:fallback:
    desc: Run no-telemetry fallback scenario (full pipeline)
    deps: [e2e:ensure-cluster]
    cmds:
      - ./test/e2e/apps/deploy.sh base
      - task: e2e:discover
      - task: e2e:plan
      - task: e2e:apply-otel
      - task: e2e:apply-source-contract
      - task: e2e:verify

  e2e:scenario:detector-failure:
    desc: Verify discovery fails closed and never writes a profile after a detector failure
    deps: [e2e:ensure-build]
    cmds:
      - ./test/e2e/scenarios/detector-failure/run.sh

  e2e:scenario:source-contract-rejection:
    desc: Verify backend rejects a mismatched source plan and restores the valid contract
    cmds:
      - ./test/e2e/scenarios/source-contract-rejection/run.sh

  e2e:debug:api:
    desc: Query the backend REST API status endpoint via a dedicated local port-forward
    cmds:
      - |
        lsof -ti :{{.BACKEND_API_LOCAL_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.KIND_NAMESPACE}} deployment/oksg-backend {{.BACKEND_API_LOCAL_PORT}}:8080 &
        PF_PID=$!
        sleep 2
        curl -sf http://localhost:{{.BACKEND_API_LOCAL_PORT}}/api/v1/status
        kill $PF_PID 2>/dev/null || true

  e2e:debug:logs:
    desc: Tail backend logs and filter for write confirmations and skipped-entity warnings
    cmds:
      - kubectl logs -n {{.KIND_NAMESPACE}} -l app.kubernetes.io/component=backend --tail=200 | grep -E '(wrote metric samples|skipping envelope|error)'

  e2e:traffic:
    desc: Send gateway-go traffic; optionally send TRAFFIC_ERROR_REQUESTS to /error for servicegraph error metrics
    vars:
      TRAFFIC_REQUESTS: '{{default .TRAFFIC_REQUESTS_DEFAULT .TRAFFIC_REQUESTS}}'
      TRAFFIC_ERROR_REQUESTS: '{{default .TRAFFIC_ERROR_REQUESTS_DEFAULT .TRAFFIC_ERROR_REQUESTS}}'
      TRAFFIC_INTERVAL: '{{default .TRAFFIC_INTERVAL_DEFAULT .TRAFFIC_INTERVAL}}'
      TRAFFIC_INTERLEAVE_ERRORS: '{{default "false" .TRAFFIC_INTERLEAVE_ERRORS}}'
    cmds:
      - |
        lsof -ti :{{.GATEWAY_LOCAL_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.TARGET_NAMESPACE}} svc/gateway-go {{.GATEWAY_LOCAL_PORT}}:8080 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null || true" EXIT
        sleep 2
        send_normal() {
          echo -n "  [ok $1] "
          curl -sf http://localhost:{{.GATEWAY_LOCAL_PORT}}/ | jq -c '{gateway: .service, results: [.results[] | {s: .service, status: .status}]}' 2>/dev/null || echo "(request failed)"
        }
        send_error() {
          echo -n "  [error $1] "
          curl -s http://localhost:{{.GATEWAY_LOCAL_PORT}}/error | jq -c '{gateway: .service, mode: .mode, results: [.results[] | {s: .service, status: .status}]}' 2>/dev/null || echo "(request failed)"
        }
        if [ "{{.TRAFFIC_INTERLEAVE_ERRORS}}" = "true" ] && [ "{{.TRAFFIC_ERROR_REQUESTS}}" -gt 0 ]; then
          . "$(pwd)/test/e2e/scripts/traffic_schedule.sh"
          total=$(({{.TRAFFIC_REQUESTS}} + {{.TRAFFIC_ERROR_REQUESTS}}))
          echo "Sending $total interleaved requests ({{.TRAFFIC_REQUESTS}} normal, {{.TRAFFIC_ERROR_REQUESTS}} errors)..."
          normal_i=0
          error_i=0
          for request_kind in $(interleaved_request_kinds "{{.TRAFFIC_REQUESTS}}" "{{.TRAFFIC_ERROR_REQUESTS}}"); do
            if [ "$request_kind" = "error" ]; then
              error_i=$((error_i + 1))
              send_error "$error_i/{{.TRAFFIC_ERROR_REQUESTS}}"
            else
              normal_i=$((normal_i + 1))
              send_normal "$normal_i/{{.TRAFFIC_REQUESTS}}"
            fi
            sleep {{.TRAFFIC_INTERVAL}}
          done
        else
          echo "Sending {{.TRAFFIC_REQUESTS}} requests to gateway (triggers service-a + service-b calls)..."
          for i in $(seq 1 {{.TRAFFIC_REQUESTS}}); do
            send_normal "$i/{{.TRAFFIC_REQUESTS}}"
            sleep {{.TRAFFIC_INTERVAL}}
          done
          if [ "{{.TRAFFIC_ERROR_REQUESTS}}" -gt 0 ]; then
            echo "Sending {{.TRAFFIC_ERROR_REQUESTS}} intentional error requests to gateway /error..."
            for i in $(seq 1 {{.TRAFFIC_ERROR_REQUESTS}}); do
              send_error "$i/{{.TRAFFIC_ERROR_REQUESTS}}"
              sleep {{.TRAFFIC_INTERVAL}}
            done
          fi
        fi
        echo "Done. Run 'task test:e2e:debug:api' to inspect backend status and query /api/v1/graph or /api/v1/metrics for data."
        kill $PF_PID 2>/dev/null || true

  e2e:traffic:watch:
    desc: Continuously send gateway-go requests; every TRAFFIC_ERROR_EVERY request hits /error by default (set 0 to disable)
    vars:
      TRAFFIC_REQUESTS: '{{default .TRAFFIC_REQUESTS_DEFAULT .TRAFFIC_REQUESTS}}'
      TRAFFIC_ERROR_EVERY: '{{default .TRAFFIC_ERROR_EVERY_DEFAULT .TRAFFIC_ERROR_EVERY}}'
      TRAFFIC_INTERVAL: '{{default .TRAFFIC_INTERVAL_DEFAULT .TRAFFIC_INTERVAL}}'
    cmds:
      - |
        lsof -ti :{{.GATEWAY_LOCAL_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.TARGET_NAMESPACE}} svc/gateway-go {{.GATEWAY_LOCAL_PORT}}:8080 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null || true" EXIT
        sleep 2
        echo "Streaming requests to gateway (Ctrl-C to stop)..."
        i=0
        while true; do
          i=$((i+1))
          path="/"
          label="ok"
          if [ "{{.TRAFFIC_ERROR_EVERY}}" -gt 0 ] && [ $((i % {{.TRAFFIC_ERROR_EVERY}})) -eq 0 ]; then
            path="/error"
            label="error"
          fi
          echo -n "  [$i $label] "
          curl -s "http://localhost:{{.GATEWAY_LOCAL_PORT}}${path}" | jq -c '{gateway: .service, mode: .mode, results: [.results[] | {s: .service, status: .status}]}' 2>/dev/null || echo "(request failed)"
          sleep {{.TRAFFIC_INTERVAL}}
        done

  cluster:profile:
    desc: Print the resolved cluster profile variables for the active CLUSTER_PROFILE
    cmds:
      - |
        echo "CLUSTER_PROFILE={{.CLUSTER_PROFILE}}"
        echo "CLUSTER_ENGINE={{.CLUSTER_ENGINE}}"
        echo "CLUSTER_LOCATION={{.CLUSTER_LOCATION}}"
        echo "REGISTRY_HOST={{.REGISTRY_HOST}}"
        echo "IMAGE_TAG={{.IMAGE_TAG}}"
        echo "IMAGE_PLATFORM={{.IMAGE_PLATFORM}}"
        echo "KUBECONFIG={{.KUBECONFIG}}"

  cluster:tunnel:
    desc: Open an optional SSH registry-inspection tunnel for k3s+ssh profiles (foreground; Ctrl-C to stop)
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          k3s)  ./test/e2e/cluster/k3s/tunnel.sh ;;
          kind) echo "tunnel not required for CLUSTER_ENGINE=kind"; exit 0 ;;
          *)    echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2; exit 1 ;;
        esac

  cluster:doctor:
    desc: Run pre-flight checks against the active cluster profile
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          k3s)
            ./test/e2e/cluster/k3s/doctor.sh
            ;;
          kind)
            # Same checks as e2e:ensure-cluster's kind arm — kept inline
            # so cluster:doctor never re-enters the `task` CLI.
            if ! kind get clusters 2>/dev/null | grep -qx "{{.KIND_CLUSTER_NAME}}"; then
              echo "Cluster not found. Run 'task test:e2e:setup' first." >&2
              exit 1
            fi
            if ! docker inspect -f '{{`{{.State.Running}}`}}' {{.KIND_REGISTRY_NAME}} 2>/dev/null | grep -q true; then
              echo "Registry not running. Run 'task test:e2e:setup' first." >&2
              exit 1
            fi
            echo "kind+local cluster looks healthy"
            ;;
          *)
            echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2
            exit 1
            ;;
        esac
