version: "3"

vars:
  KIND_CLUSTER_NAME: oksg-test
  KIND_REGISTRY_NAME: oksg-kind-registry
  KIND_REGISTRY_PORT: "5001"
  KIND_NAMESPACE: oksg-system
  HELM_RELEASE_NAME: oksg-otel
  HELM_CHART_PATH: ./deploy/helm/oksg-otel
  TARGET_NAMESPACE: oksg-demo
  BACKEND_IMAGE_REPOSITORY: localhost:{{.KIND_REGISTRY_PORT}}/oksg-backend
  BACKEND_IMAGE_TAG: latest
  BACKEND_IMAGE_PULL_POLICY: Always
  VARIANT: base
  E2E_OUTPUT_DIR: ./bin/e2e
  PROFILE_PATH: ./bin/e2e/profile.json
  VALUES_PATH: ./bin/e2e/otel-values.yaml
  RENDERED_PATH: ./bin/e2e/rendered
  DISCOVERY_JOB_BIN: ./bin/discovery-job
  BACKEND_HEALTH_PORT: "13133"
  BACKEND_API_LOCAL_PORT: "18081"
  GATEWAY_LOCAL_PORT: "18080"
  TRAFFIC_REQUESTS: "20"
  TRAFFIC_INTERVAL: "0.5"
  KUBECONFIG:
    sh: echo "${KUBECONFIG:-$HOME/.kube/config}"

tasks:
  e2e:setup:
    desc: Create kind cluster with local registry
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - ./test/e2e/kind/setup.sh {{.KIND_CLUSTER_NAME}}

  e2e:teardown:
    desc: Destroy kind cluster and registry
    cmds:
      - ./test/e2e/kind/teardown.sh {{.KIND_CLUSTER_NAME}}

  e2e:deploy:
    desc: Build and deploy test apps to cluster (use VARIANT=base or VARIANT=with-prometheus)
    cmds:
      - KIND_REGISTRY_PORT={{.KIND_REGISTRY_PORT}} ./test/e2e/apps/deploy.sh {{.VARIANT}}

  e2e:ensure-build:
    desc: Build discovery-job into bin/ so e2e never creates binaries in repo root
    cmds:
      - mkdir -p bin
      - go build -o ./bin/discovery-job ./cmd/discovery-job

  e2e:discover:
    desc: Run Kubernetes discovery against the cluster
    deps: [e2e:ensure-build]
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - "{{.DISCOVERY_JOB_BIN}} --mode=discover --kubeconfig={{.KUBECONFIG}} --cluster-name={{.KIND_CLUSTER_NAME}} --output={{.PROFILE_PATH}} --namespace={{.KIND_NAMESPACE}} --target-namespace={{.TARGET_NAMESPACE}}"

  e2e:plan:
    desc: Generate Helm values from discovery output
    deps: [e2e:ensure-build]
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - "{{.DISCOVERY_JOB_BIN}} --mode=plan --profile={{.PROFILE_PATH}} --values-output={{.VALUES_PATH}} --rendered-output={{.RENDERED_PATH}} --namespace={{.KIND_NAMESPACE}} --chart-path={{.HELM_CHART_PATH}} --release-name={{.HELM_RELEASE_NAME}} --backend-image-repository={{.BACKEND_IMAGE_REPOSITORY}} --backend-image-tag={{.BACKEND_IMAGE_TAG}} --backend-image-pull-policy={{.BACKEND_IMAGE_PULL_POLICY}}"

  e2e:apply-profile:
    desc: Create or update a ConfigMap from the discovery profile for backend structural topology
    cmds:
      - kubectl create configmap oksg-discovery-profile --from-file=profile.json={{.PROFILE_PATH}} -n {{.KIND_NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -

  e2e:apply-otel:
    desc: Install or upgrade the OTel Helm release with generated values and external storage
    cmds:
      - helm dependency build {{.HELM_CHART_PATH}}
      - >-
        helm upgrade --install {{.HELM_RELEASE_NAME}} {{.HELM_CHART_PATH}}
        --namespace {{.KIND_NAMESPACE}} --create-namespace
        -f {{.VALUES_PATH}}
        --set storage.backend=external
        --set storage.postgresql.enabled=true
        --set storage.victoriametrics.enabled=true
        --set postgresql.auth.password=oksg

  e2e:verify:
    desc: Verify generated collectors and storage backends are deployed
    cmds:
      - helm status {{.HELM_RELEASE_NAME}} -n {{.KIND_NAMESPACE}}
      - kubectl get pods -n {{.KIND_NAMESPACE}}
      - echo "Waiting for storage backends..."
      - kubectl rollout status statefulset/{{.HELM_RELEASE_NAME}}-postgresql -n {{.KIND_NAMESPACE}} --timeout=180s
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=victoria-metrics-single -n {{.KIND_NAMESPACE}} --timeout=180s
      - echo "Waiting for collector rollouts..."
      - kubectl rollout status deployment/oksg-backend -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl rollout status deployment/otel-collector-gateway -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl rollout status daemonset/otel-collector-agent -n {{.KIND_NAMESPACE}} --timeout=120s
      - kubectl logs -n {{.KIND_NAMESPACE}} -l app.kubernetes.io/name={{.HELM_RELEASE_NAME}},app.kubernetes.io/component=agent --tail=30
      - kubectl logs -n {{.KIND_NAMESPACE}} -l app.kubernetes.io/name={{.HELM_RELEASE_NAME}},app.kubernetes.io/component=gateway --tail=30
      - kubectl logs -n {{.KIND_NAMESPACE}} -l app.kubernetes.io/name={{.HELM_RELEASE_NAME}},app.kubernetes.io/component=backend --tail=30

  e2e:reset:
    desc: Remove deployed OTel Helm release
    cmds:
      - helm uninstall {{.HELM_RELEASE_NAME}} --namespace {{.KIND_NAMESPACE}} || true

  e2e:reset-apps:
    desc: Remove deployed demo microservices
    cmds:
      - kubectl delete namespace {{.TARGET_NAMESPACE}} --ignore-not-found

  e2e:reset-all:
    desc: Remove both OTel collectors and demo microservices
    cmds:
      - task: e2e:reset
      - task: e2e:reset-apps

  e2e:ensure-cluster:
    desc: Ensure kind cluster and registry are running
    cmds:
      - |
        if ! kind get clusters 2>/dev/null | grep -qx "{{.KIND_CLUSTER_NAME}}"; then
          echo "Cluster not found. Run 'task test:e2e:setup' first."
          exit 1
        fi
      - |
        if ! docker inspect -f '{{`{{.State.Running}}`}}' {{.KIND_REGISTRY_NAME}} 2>/dev/null | grep -q true; then
          echo "Registry not running. Run 'task test:e2e:setup' first."
          exit 1
        fi
    silent: true

  e2e:scenario:prometheus:
    desc: Run Prometheus discovery scenario (full pipeline)
    deps: [e2e:ensure-cluster]
    vars:
      VARIANT: with-prometheus
    cmds:
      - task: e2e:deploy
        vars: { VARIANT: "with-prometheus" }
      - task: e2e:discover
      - task: e2e:plan
      - task: e2e:apply-otel
      - task: e2e:apply-profile
      - task: e2e:verify

  e2e:scenario:fallback:
    desc: Run no-telemetry fallback scenario (full pipeline)
    deps: [e2e:ensure-cluster]
    vars:
      VARIANT: base
    cmds:
      - task: e2e:deploy
        vars: { VARIANT: "base" }
      - task: e2e:discover
      - task: e2e:plan
      - task: e2e:apply-otel
      - task: e2e:apply-profile
      - task: e2e:verify

  e2e:debug:metrics:
    desc: Dump all metric samples from the backend /debug/metrics endpoint (port-forwards health port, curls, then cleans up)
    cmds:
      - |
        lsof -ti :{{.BACKEND_HEALTH_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.KIND_NAMESPACE}} deployment/oksg-backend {{.BACKEND_HEALTH_PORT}}:{{.BACKEND_HEALTH_PORT}} &
        PF_PID=$!
        sleep 2
        curl -sf http://localhost:{{.BACKEND_HEALTH_PORT}}/debug/metrics
        kill $PF_PID 2>/dev/null || true

  e2e:debug:graph:
    desc: Dump the current topology graph snapshot from the backend /debug/graph endpoint
    cmds:
      - |
        lsof -ti :{{.BACKEND_HEALTH_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.KIND_NAMESPACE}} deployment/oksg-backend {{.BACKEND_HEALTH_PORT}}:{{.BACKEND_HEALTH_PORT}} &
        PF_PID=$!
        sleep 2
        curl -sf http://localhost:{{.BACKEND_HEALTH_PORT}}/debug/graph
        kill $PF_PID 2>/dev/null || true

  e2e:debug:api:
    desc: Query the backend REST API status endpoint via a dedicated local port-forward
    cmds:
      - |
        lsof -ti :{{.BACKEND_API_LOCAL_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.KIND_NAMESPACE}} deployment/oksg-backend {{.BACKEND_API_LOCAL_PORT}}:8080 &
        PF_PID=$!
        sleep 2
        curl -sf http://localhost:{{.BACKEND_API_LOCAL_PORT}}/api/v1/status
        kill $PF_PID 2>/dev/null || true

  e2e:debug:logs:
    desc: Tail backend logs and filter for write confirmations and skipped-entity warnings
    cmds:
      - kubectl logs -n {{.KIND_NAMESPACE}} -l app.kubernetes.io/component=backend --tail=200 | grep -E '(wrote metric samples|skipping envelope|error)'

  e2e:traffic:
    desc: Send TRAFFIC_REQUESTS requests to gateway-go via port-forward to generate observable traffic (default 20 requests, 0.5s apart)
    cmds:
      - |
        lsof -ti :{{.GATEWAY_LOCAL_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.TARGET_NAMESPACE}} svc/gateway-go {{.GATEWAY_LOCAL_PORT}}:8080 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null || true" EXIT
        sleep 2
        echo "Sending {{.TRAFFIC_REQUESTS}} requests to gateway (triggers service-a + service-b calls)..."
        for i in $(seq 1 {{.TRAFFIC_REQUESTS}}); do
          echo -n "  [$i/{{.TRAFFIC_REQUESTS}}] "
          curl -sf http://localhost:{{.GATEWAY_LOCAL_PORT}}/ | jq -c '{gateway: .service, results: [.results[] | {s: .service, status: .status}]}' 2>/dev/null || echo "(request failed)"
          sleep {{.TRAFFIC_INTERVAL}}
        done
        echo "Done. Run 'task test:e2e:debug:metrics' or 'task test:e2e:debug:graph' to inspect results."
        kill $PF_PID 2>/dev/null || true

  e2e:traffic:watch:
    desc: Continuously send requests to gateway-go every TRAFFIC_INTERVAL seconds (Ctrl-C to stop)
    cmds:
      - |
        lsof -ti :{{.GATEWAY_LOCAL_PORT}} | xargs kill 2>/dev/null || true
        kubectl port-forward -n {{.TARGET_NAMESPACE}} svc/gateway-go {{.GATEWAY_LOCAL_PORT}}:8080 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null || true" EXIT
        sleep 2
        echo "Streaming requests to gateway (Ctrl-C to stop)..."
        i=0
        while true; do
          i=$((i+1))
          echo -n "  [$i] "
          curl -sf http://localhost:{{.GATEWAY_LOCAL_PORT}}/ | jq -c '{gateway: .service, results: [.results[] | {s: .service, status: .status}]}' 2>/dev/null || echo "(request failed)"
          sleep {{.TRAFFIC_INTERVAL}}
        done
