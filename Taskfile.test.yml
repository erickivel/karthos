version: "3"

vars:
  CLUSTER_PROFILE:
    sh: . test/e2e/cluster/profile.sh && echo "$CLUSTER_PROFILE"
  CLUSTER_ENGINE:
    sh: . test/e2e/cluster/profile.sh && echo "$CLUSTER_ENGINE"
  CLUSTER_LOCATION:
    sh: . test/e2e/cluster/profile.sh && echo "$CLUSTER_LOCATION"
  REGISTRY_HOST:
    sh: . test/e2e/cluster/profile.sh && echo "$REGISTRY_HOST"
  IMAGE_TAG:
    sh: . test/e2e/cluster/profile.sh && echo "$IMAGE_TAG"
  IMAGE_PLATFORM:
    sh: . test/e2e/cluster/profile.sh && echo "$IMAGE_PLATFORM"
  KUBECONFIG:
    sh: . test/e2e/cluster/profile.sh && echo "$KUBECONFIG"
  K3S_SSH_HOST:
    sh: . test/e2e/cluster/profile.sh && echo "${K3S_SSH_HOST:-}"
  KIND_CLUSTER_NAME:
    sh: . test/e2e/cluster/profile.sh && echo "${KIND_CLUSTER_NAME:-karthos-test}"
  KIND_NAMESPACE: karthos-system
  HELM_RELEASE_NAME: karthos
  HELM_CHART_PATH: ./deploy/helm/karthos
  TARGET_NAMESPACE: karthos-demo
  SPARSE_NAMESPACE: karthos-sparse
  BACKEND_IMAGE_REPOSITORY: '{{.REGISTRY_HOST}}/karthos-backend'
  BACKEND_IMAGE_TAG: '{{.IMAGE_TAG}}'
  BACKEND_IMAGE_PULL_POLICY: Always
  FRONTEND_IMAGE_REPOSITORY: '{{.REGISTRY_HOST}}/karthos-frontend'
  FRONTEND_IMAGE_TAG: '{{.IMAGE_TAG}}'
  FRONTEND_IMAGE_PULL_POLICY: Always
  E2E_OUTPUT_DIR: ./bin/e2e
  PROFILE_PATH: ./bin/e2e/profile.json
  VALUES_PATH: ./bin/e2e/otel-values.yaml
  RENDERED_PATH: ./bin/e2e/rendered
  DISCOVERY_JOB_BIN: ./bin/discovery-job
  BACKEND_API_LOCAL_PORT_DEFAULT: "18081"
  BACKEND_API_LOCAL_PORT: '{{default .BACKEND_API_LOCAL_PORT_DEFAULT .BACKEND_API_LOCAL_PORT}}'
  GATEWAY_LOCAL_PORT_DEFAULT: "18080"
  GATEWAY_LOCAL_PORT: '{{default .GATEWAY_LOCAL_PORT_DEFAULT .GATEWAY_LOCAL_PORT}}'
  TRAFFIC_REQUESTS_DEFAULT: "20"
  TRAFFIC_ERROR_REQUESTS_DEFAULT: "0"
  TRAFFIC_ERROR_EVERY_DEFAULT: "5"
  TRAFFIC_INTERVAL_DEFAULT: "0.5"

env:
  KUBECONFIG: '{{.KUBECONFIG}}'

tasks:
  e2e:setup:
    desc: Provision local kind or prepare the configured remote k3s environment
    cmds:
      - mkdir -p {{.E2E_OUTPUT_DIR}}
      - |
        case "{{.CLUSTER_ENGINE}}" in
          kind) ./test/e2e/kind/setup.sh {{.KIND_CLUSTER_NAME}} ;;
          k3s)  ./test/e2e/cluster/k3s/setup.sh ;;
          *)    echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2; exit 1 ;;
        esac

  e2e:teardown:
    desc: Destroy local kind infrastructure or remove harness-managed remote resources
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          kind) ./test/e2e/kind/teardown.sh {{.KIND_CLUSTER_NAME}} ;;
          k3s)  ./test/e2e/cluster/k3s/teardown.sh ;;
          *)    echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2; exit 1 ;;
        esac

  _e2e:deploy-fixtures:
    internal: true
    cmds:
      # VARIANT is read from the shell env (no Task-CLI-var form). CLI users
      # pass it as an env-var prefix when invoking this internal task.
      - ./test/e2e/apps/deploy.sh "${VARIANT:-base}"

  _e2e:install-istio:
    internal: true
    deps: [_e2e:ensure-cluster]
    cmds:
      - ./test/e2e/cluster/istio.sh install

  _e2e:reset-istio:
    internal: true
    cmds:
      - ./test/e2e/cluster/istio.sh reset

  _e2e:ensure-build:
    internal: true
    cmds:
      - mkdir -p bin
      - go build -o ./bin/discovery-job ./cmd/discovery-job

  _e2e:deploy-platform:
    internal: true
    cmds:
      - ./test/e2e/platform/deploy.sh

  _e2e:reset-platform:
    internal: true
    cmds:
      - ./test/e2e/platform/undeploy.sh

  _e2e:reset-fixtures:
    internal: true
    cmds:
      - kubectl delete namespace {{.TARGET_NAMESPACE}} --ignore-not-found
      - kubectl delete namespace {{.SPARSE_NAMESPACE}} --ignore-not-found

  e2e:reset:
    desc: Remove the Karthos release, fixture namespaces, PostgreSQL data, and harness-owned Istio
    cmds:
      - task: _e2e:reset-istio
      - task: _e2e:reset-platform
      - task: _e2e:reset-fixtures

  _e2e:cleanup-scenario:
    internal: true
    cmds:
      - ./test/e2e/cluster/istio.sh reset-if-owned
      - task: _e2e:reset-platform
      - task: _e2e:reset-fixtures

  _e2e:ensure-cluster:
    internal: true
    cmds:
      - CLUSTER_ENGINE={{.CLUSTER_ENGINE}} KIND_CLUSTER_NAME={{.KIND_CLUSTER_NAME}} K3S_SSH_HOST={{.K3S_SSH_HOST}} ./test/e2e/platform/ensure-cluster.sh
    silent: true

  _e2e:scenario:prometheus:prepare:
    internal: true
    deps: [_e2e:ensure-cluster]
    cmds:
      - ./test/e2e/apps/deploy.sh with-prometheus
      - task: _e2e:deploy-platform

  e2e:scenario:prometheus:
    desc: Run the complete Prometheus discovery and servicegraph accuracy scenario
    cmds:
      - defer: {task: _e2e:cleanup-scenario}
      - task: _e2e:scenario:prometheus:prepare
      - HELM_RELEASE_NAME=karthos KIND_NAMESPACE=karthos-system GATEWAY_LOCAL_PORT={{.GATEWAY_LOCAL_PORT}} ./test/e2e/scenarios/prometheus-available/run.sh

  _e2e:scenario:istio:prepare:
    internal: true
    deps: [_e2e:ensure-cluster]
    cmds:
      - task: _e2e:install-istio
      - ./test/e2e/apps/deploy.sh with-istio
      - task: _e2e:deploy-platform
      - task: e2e:traffic
        vars:
          TRAFFIC_REQUESTS: "30"
          TRAFFIC_ERROR_REQUESTS: "10"
          TRAFFIC_INTERVAL: "0.2"

  e2e:scenario:istio:
    desc: Reset owned resources, run Istio HTTP, gRPC, and TCP accuracy checks, and retain the environment
    cmds:
      - task: _e2e:ensure-cluster
      - task: _e2e:cleanup-scenario
      - task: _e2e:scenario:istio:prepare
      - HELM_RELEASE_NAME=karthos KIND_NAMESPACE=karthos-system GATEWAY_LOCAL_PORT={{.GATEWAY_LOCAL_PORT}} ./test/e2e/scenarios/istio-available/run.sh

  e2e:scenario:fallback:
    desc: Deploy and verify the strict direct-source fallback scenario
    cmds:
      - task: e2e:reset
      - defer: {task: _e2e:cleanup-scenario}
      - task: _e2e:scenario:fallback:prepare
      - ./test/e2e/scenarios/no-telemetry/run.sh

  _e2e:scenario:fallback:prepare:
    internal: true
    deps: [_e2e:ensure-cluster]
    cmds:
      - ./test/e2e/apps/deploy.sh base
      - task: _e2e:deploy-platform

  e2e:scenario:detector-failure:
    desc: Verify detector failure produces no capability profile or partial deployment
    deps: [_e2e:ensure-build]
    cmds:
      - ./test/e2e/scenarios/detector-failure/run.sh

  e2e:scenario:source-contract-rejection:
    desc: Verify the backend rejects a mismatched source plan and restores the valid contract
    deps: [_e2e:ensure-cluster]
    cmds:
      - defer: {task: _e2e:cleanup-scenario}
      - ./test/e2e/apps/deploy.sh base
      - task: _e2e:deploy-platform
      - HELM_RELEASE_NAME=karthos KIND_NAMESPACE=karthos-system ./test/e2e/scenarios/source-contract-rejection/run.sh

  e2e:debug:api:
    desc: Open a temporary port-forward and query backend status
    cmds:
      - BACKEND_API_LOCAL_PORT={{.BACKEND_API_LOCAL_PORT}} KIND_NAMESPACE={{.KIND_NAMESPACE}} HELM_RELEASE_NAME={{.HELM_RELEASE_NAME}} ./test/e2e/scripts/debug-api.sh

  e2e:debug:logs:
    desc: Follow backend logs and stream write confirmations, skipped envelopes, and errors until interrupted
    cmds:
      - kubectl logs -f -n {{.KIND_NAMESPACE}} -l app.kubernetes.io/component=backend --tail=200 | grep -E '(wrote metric samples|skipping envelope|error)'

  e2e:traffic:
    desc: Send configurable normal and error requests through the gateway fixture
    vars:
      TRAFFIC_REQUESTS: '{{default .TRAFFIC_REQUESTS_DEFAULT .TRAFFIC_REQUESTS}}'
      TRAFFIC_ERROR_REQUESTS: '{{default .TRAFFIC_ERROR_REQUESTS_DEFAULT .TRAFFIC_ERROR_REQUESTS}}'
      TRAFFIC_INTERVAL: '{{default .TRAFFIC_INTERVAL_DEFAULT .TRAFFIC_INTERVAL}}'
      TRAFFIC_INTERLEAVE_ERRORS: '{{default "false" .TRAFFIC_INTERLEAVE_ERRORS}}'
    cmds:
      - GATEWAY_LOCAL_PORT={{.GATEWAY_LOCAL_PORT}} TARGET_NAMESPACE={{.TARGET_NAMESPACE}} TRAFFIC_REQUESTS={{.TRAFFIC_REQUESTS}} TRAFFIC_ERROR_REQUESTS={{.TRAFFIC_ERROR_REQUESTS}} TRAFFIC_INTERVAL={{.TRAFFIC_INTERVAL}} TRAFFIC_INTERLEAVE_ERRORS={{.TRAFFIC_INTERLEAVE_ERRORS}} ./test/e2e/scripts/traffic.sh once

  e2e:traffic:watch:
    desc: Send gateway traffic continuously until interrupted
    vars:
      TRAFFIC_ERROR_EVERY: '{{default .TRAFFIC_ERROR_EVERY_DEFAULT .TRAFFIC_ERROR_EVERY}}'
      TRAFFIC_INTERVAL: '{{default .TRAFFIC_INTERVAL_DEFAULT .TRAFFIC_INTERVAL}}'
    cmds:
      - GATEWAY_LOCAL_PORT={{.GATEWAY_LOCAL_PORT}} TARGET_NAMESPACE={{.TARGET_NAMESPACE}} TRAFFIC_ERROR_EVERY={{.TRAFFIC_ERROR_EVERY}} TRAFFIC_INTERVAL={{.TRAFFIC_INTERVAL}} ./test/e2e/scripts/traffic.sh watch

  cluster:profile:
    desc: Print the resolved profile, engine, registry, platform, and kubeconfig
    cmds:
      - |
        echo "CLUSTER_PROFILE={{.CLUSTER_PROFILE}}"
        echo "CLUSTER_ENGINE={{.CLUSTER_ENGINE}}"
        echo "CLUSTER_LOCATION={{.CLUSTER_LOCATION}}"
        echo "REGISTRY_HOST={{.REGISTRY_HOST}}"
        echo "IMAGE_TAG={{.IMAGE_TAG}}"
        echo "IMAGE_PLATFORM={{.IMAGE_PLATFORM}}"
        echo "KUBECONFIG={{.KUBECONFIG}}"

  cluster:tunnel:
    desc: Open an optional SSH registry-inspection tunnel for k3s+ssh profiles (foreground; Ctrl-C to stop)
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          k3s)  ./test/e2e/cluster/k3s/tunnel.sh ;;
          kind) echo "tunnel not required for CLUSTER_ENGINE=kind"; exit 0 ;;
          *)    echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2; exit 1 ;;
        esac

  cluster:doctor:
    desc: Run engine-aware preflight checks against the configured cluster profile
    cmds:
      - |
        case "{{.CLUSTER_ENGINE}}" in
          k3s)
            ./test/e2e/cluster/k3s/doctor.sh
            ;;
          kind)
            # Same checks as e2e:ensure-cluster's kind arm — kept inline
            # so cluster:doctor never re-enters the `task` CLI.
            if ! kind get clusters 2>/dev/null | grep -qx "{{.KIND_CLUSTER_NAME}}"; then
              echo "Cluster not found. Run 'task test:e2e:setup' first." >&2
              exit 1
            fi
            if ! docker inspect -f '{{`{{.State.Running}}`}}' karthos-kind-registry 2>/dev/null | grep -q true; then
              echo "Registry not running. Run 'task test:e2e:setup' first." >&2
              exit 1
            fi
            echo "kind+local cluster looks healthy"
            ;;
          *)
            echo "unsupported CLUSTER_ENGINE: {{.CLUSTER_ENGINE}}" >&2
            exit 1
            ;;
        esac
