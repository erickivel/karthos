apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: oksg-demo
data:
  SERVICE_A_URL: "http://service-a-python:8081/process"
  SERVICE_B_URL: "http://service-b-node:8082/compute"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: oksg-demo
type: Opaque
stringData:
  API_KEY: "demo-key-for-testing"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: oksg-demo
spec:
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-go
                port:
                  number: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bundle-config
  namespace: oksg-demo
data:
  FEATURE_MODE: "topology-qa"
---
apiVersion: v1
kind: Secret
metadata:
  name: bundle-secret
  namespace: oksg-demo
type: Opaque
stringData:
  TOKEN: "topology-qa-secret"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bundle-cache
  namespace: oksg-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
