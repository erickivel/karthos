apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-go
  namespace: karthos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-go
  template:
    metadata:
      labels:
        app: gateway-go
    spec:
      nodeSelector:
        kubernetes.io/hostname: karthos-test-control-plane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gateway-go
          image: localhost:5001/gateway-go:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(HOST_IP):4318
            - name: OTEL_SERVICE_NAME
              value: gateway-go
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-go
  namespace: karthos-demo
spec:
  type: NodePort
  selector:
    app: gateway-go
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
