apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  SERVICE_A_URL: "http://service-a-python:8081/process"
  SERVICE_B_URL: "http://service-b-node:8082/compute"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
type: Opaque
stringData:
  API_KEY: "demo-key-for-testing"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
spec:
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-go
                port:
                  number: 8080
