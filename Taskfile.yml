version: "3"

dotenv: ['.env']

includes:
  test:
    taskfile: ./Taskfile.test.yml
  web:
    taskfile: ./web/Taskfile.yml

tasks:
  default:
    cmds:
      - task: test

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w ./cmd ./pkg

  fmt:check:
    desc: Check Go code formatting (CI)
    cmds:
      - test -z "$(gofmt -l ./cmd ./pkg)"

  generate:
    desc: Generate JSON schemas
    cmds:
      - go generate ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run unit tests with race detection and coverage
    cmds:
      - go test -race -coverprofile=coverage.out ./...

  test:fixtures:
    desc: Run repository-owned nested fixture test suites
    cmds:
      - bash test/e2e/apps/deploy_test.sh
      - bash test/e2e/scenarios/istio-available/run_test.sh
      - go -C test/e2e/apps/instrumented/gateway-go test ./...
      - go -C test/e2e/apps/mesh-protocol-go test ./...
      - bash test/e2e/scripts/traffic_schedule_test.sh
      - python3 test/e2e/scenarios/istio-available/verify_protocol_metrics_test.py

  build:
    desc: Build all binaries into bin/ (never write binaries to repo root)
    deps:
      - fmt
    cmds:
      - mkdir -p bin
      - go build -o ./bin/backend ./cmd/backend
      - go build -o ./bin/controller ./cmd/controller
      - go build -o ./bin/discovery-job ./cmd/discovery-job

  build:check:
    desc: Build all binaries without formatting (CI)
    cmds:
      - mkdir -p bin
      - go build -o ./bin/backend ./cmd/backend
      - go build -o ./bin/controller ./cmd/controller
      - go build -o ./bin/discovery-job ./cmd/discovery-job

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  lint:
    desc: Run golangci-lint (long timeout for CI package loading)
    cmds:
      - golangci-lint run --timeout=5m ./...

  security:
    desc: Run security scanning (govulncheck + gosec)
    cmds:
      - govulncheck ./... || true
      - gosec -quiet ./...

  ci:
    desc: Run all CI checks locally
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race
      - task: test:fixtures
      - task: build:check
      - task: web:build

  clean:
    desc: Remove generated artifacts and any binaries accidentally built in repo root
    cmds:
      - rm -rf bin coverage.out schemas
      - rm -f discovery-job backend controller
