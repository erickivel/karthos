{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oksg-backend
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-backend-pod-lifecycle" (include "oksg-otel.name" .) }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-backend-pod-lifecycle" (include "oksg-otel.name" .) }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-backend-pod-lifecycle" (include "oksg-otel.name" .) }}
subjects:
  - kind: ServiceAccount
    name: oksg-backend
    namespace: {{ include "oksg-otel.namespace" . }}
{{- end }}
