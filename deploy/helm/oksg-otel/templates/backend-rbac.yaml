apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oksg-otel.backendName" . }}
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-backend-structure" (include "oksg-otel.name" .) }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "services", "replicationcontrollers"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-backend-structure" (include "oksg-otel.name" .) }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-backend-structure" (include "oksg-otel.name" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oksg-otel.backendName" . }}
    namespace: {{ include "oksg-otel.namespace" . }}
