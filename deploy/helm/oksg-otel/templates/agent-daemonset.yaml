{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "agent") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
        app.kubernetes.io/component: agent
      annotations:
        {{- if .Values.rollout.useConfigChecksum }}
        checksum/config: {{ include "oksg-otel.agentChecksum" . }}
        {{- end }}
    spec:
      serviceAccountName: otel-collector-agent
      hostNetwork: {{ .Values.agent.hostNetwork }}
      dnsPolicy: {{ ternary "ClusterFirstWithHostNet" "ClusterFirst" .Values.agent.hostNetwork }}
      containers:
        - name: otel-collector-agent
          image: {{ include "oksg-otel.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - --config=/conf/config.yaml
            {{- if .Values.agent.featureGates }}
            - --feature-gates={{ join "," .Values.agent.featureGates }}
            {{- end }}
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.agent.logging.level | quote }}
          {{- range $key, $value := .Values.agent.runtimeEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          ports:
            - containerPort: 4317
              hostPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              hostPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 13133
              name: health
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
          resources:
{{ toYaml .Values.agent.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-agent-config
        - name: hostfs
          hostPath:
            path: /
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
