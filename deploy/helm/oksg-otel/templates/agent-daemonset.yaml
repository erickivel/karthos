apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oksg-otel.agentName" . }}
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "agent") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
        app.kubernetes.io/component: agent
      annotations:
        checksum/config: {{ include "oksg-otel.agentChecksum" . }}
    spec:
      serviceAccountName: {{ include "oksg-otel.agentName" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: {{ include "oksg-otel.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - --config=/conf/config.yaml
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OKSG_GATEWAY_GRPC_ENDPOINT
              value: {{ printf "%s:%d" (include "oksg-otel.gatewayName" .) (int .Values.gateway.service.port) | quote }}
          ports:
            - containerPort: 4317
              hostPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              hostPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 13133
              name: health
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
          resources:
{{ toYaml .Values.agent.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "oksg-otel.agentName" . }}-config
        - name: hostfs
          hostPath:
            path: /
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
