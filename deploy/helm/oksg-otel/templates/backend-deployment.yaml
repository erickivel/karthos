{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oksg-backend
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: oksg-backend
          image: {{ include "oksg-otel.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            - --grpc-listen-address=0.0.0.0:{{ .Values.backend.service.grpcPort }}
            - --http-listen-address=0.0.0.0:{{ .Values.backend.service.httpPort }}
            - --health-listen-address=0.0.0.0:{{ .Values.backend.service.healthPort }}
            - --enabled-signals={{ join "," .Values.enabledSignals }}
            - --cluster-name={{ .Values.global.clusterName }}
            {{- if .Values.backend.discoveryProfile.enabled }}
            - --discovery-profile=/etc/oksg/profile.json
            {{- end }}
          env:
            - name: OKSG_LOG_LEVEL
              value: {{ .Values.global.logging.level | quote }}
            - name: OKSG_STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            - name: OKSG_RAW_STORE_ENABLED
              value: {{ .Values.storage.rawStoreEnabled | quote }}
            - name: OKSG_TOPOLOGY_FLUSH_INTERVAL
              value: {{ .Values.backend.topologyFlushInterval | default "60s" | quote }}
            {{- if eq .Values.storage.backend "external" }}
            - name: OKSG_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "oksg-otel.name" . }}-storage
                  key: postgres-dsn
            - name: OKSG_VICTORIAMETRICS_URL
              value: {{ include "oksg-otel.vmURL" . | quote }}
            {{- end }}
          {{- range $key, $value := .Values.backend.runtimeEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.backend.service.grpcPort }}
              name: otlp-grpc
            - containerPort: {{ .Values.backend.service.httpPort }}
              name: otlp-http
            - containerPort: {{ .Values.backend.service.healthPort }}
              name: health
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- if .Values.backend.discoveryProfile.enabled }}
          volumeMounts:
            - name: discovery-profile
              mountPath: /etc/oksg
              readOnly: true
          {{- end }}
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
      {{- if .Values.backend.discoveryProfile.enabled }}
      volumes:
        - name: discovery-profile
          configMap:
            name: {{ .Values.backend.discoveryProfile.configMapName }}
      {{- end }}
{{- end }}
