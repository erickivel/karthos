apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oksg-otel.backendName" . }}
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/source-contract: {{ include (print $.Template.BasePath "/source-contract-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "oksg-otel.backendName" . }}
      containers:
        - name: backend
          image: {{ include "oksg-otel.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            - --grpc-listen-address=0.0.0.0:{{ .Values.backend.grpcPort }}
            - --health-listen-address=0.0.0.0:{{ .Values.backend.service.healthPort }}
            - --api-listen-address=0.0.0.0:{{ .Values.backend.service.apiPort }}
            - --status-stale-seconds={{ .Values.backend.statusStaleSeconds }}
            - --structure-refresh-interval={{ .Values.backend.structureRefreshInterval }}
            - --enabled-signals={{ join "," .Values.enabledSignals }}
            - --cluster-name={{ .Values.global.clusterName }}
            - --pod-lifecycle-required=true
            - --capability-profile=/etc/oksg/capability-profile.json
            - --source-plan=/etc/oksg/source-plan.json
          env:
            - name: OKSG_LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            - name: OKSG_STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            - name: OKSG_TOPOLOGY_FLUSH_INTERVAL
              value: {{ .Values.backend.topologyFlushInterval | default "60s" | quote }}
            {{- if eq .Values.storage.backend "external" }}
            - name: OKSG_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "oksg-otel.name" . }}-storage
                  key: postgres-dsn
            - name: OKSG_VICTORIAMETRICS_URL
              value: {{ include "oksg-otel.vmURL" . | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.backend.grpcPort }}
              name: otlp-grpc
            - containerPort: {{ .Values.backend.service.healthPort }}
              name: health
            - containerPort: {{ .Values.backend.service.apiPort }}
              name: api
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: source-contract
              mountPath: /etc/oksg
              readOnly: true
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
      volumes:
        - name: source-contract
          configMap:
            name: {{ include "oksg-otel.sourceContractName" . }}
