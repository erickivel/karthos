apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oksg-otel.gatewayName" . }}
  namespace: {{ include "oksg-otel.namespace" . }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oksg-otel.name" . }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include "oksg-otel.gatewayChecksum" . }}
    spec:
      serviceAccountName: {{ include "oksg-otel.gatewayName" . }}
      containers:
        - name: gateway
          image: {{ include "oksg-otel.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - --config=/conf/config.yaml
          env:
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.gateway.logging.level | quote }}
            - name: OKSG_BACKEND_GRPC_ENDPOINT
              value: {{ printf "%s:%d" (include "oksg-otel.backendName" .) (int .Values.backend.grpcPort) | quote }}
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: otlp-grpc
            - containerPort: {{ .Values.gateway.service.httpPort }}
              name: otlp-http
            - containerPort: 13133
              name: health
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "oksg-otel.gatewayName" . }}-config
