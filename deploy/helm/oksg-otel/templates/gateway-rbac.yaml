apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-gateway" (include "oksg-otel.name" .) }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
rules:
  - apiGroups: [""]
    # The pinned k8s_cluster receiver watches resourcequotas even though OKSG
    # explicitly disables the unsupported ResourceQuota metric family.
    resources: ["nodes", "pods", "namespaces", "services", "endpoints", "resourcequotas", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-gateway" (include "oksg-otel.name" .) }}
  labels:
    {{- include "oksg-otel.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-gateway" (include "oksg-otel.name" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oksg-otel.gatewayName" . }}
    namespace: {{ include "oksg-otel.namespace" . }}
