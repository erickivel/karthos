global:
  clusterName: default-cluster
  namespace: oksg-system
  releaseName: oksg-otel
  chartPath: ./deploy/helm/oksg-otel
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.156.0
    pullPolicy: IfNotPresent
  logging:
    format: json
    level: info

enabledSignals: []
namespace:
  create: true
  name: oksg-system

# Collector configuration is intentionally absent from chart defaults. It is
# generated from a discovered profile by collector/configgen and required by
# the ConfigMap templates.
agent:
  enabled: true
  hostNetwork: true
  logging:
    format: json
    level: info
  featureGates: []
  runtimeEnv: {}
  resources: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}

gateway:
  enabled: true
  logging:
    format: json
    level: info
  featureGates: []
  runtimeEnv: {}
  replicas: 1
  service:
    type: ClusterIP
    port: 4317
    httpPort: 4318
  resources: {}

backend:
  enabled: true
  grpcEndpoint: oksg-backend:4317
  httpEndpoint: 0.0.0.0:4318
  image:
    repository: oksg-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    grpcPort: 4317
    httpPort: 4318
    healthPort: 13133
    apiPort: 8080
  statusStaleSeconds: 300
  topologyFlushInterval: "60s"
  runtimeEnv: {}
  sourceContract:
    enabled: true
    configMapName: oksg-source-contract
  resources: {}

storage:
  backend: memory
  rawStoreEnabled: false
  postgresql:
    enabled: false
    dsn: ""
  victoriametrics:
    enabled: false
    url: ""

postgresql:
  auth:
    database: oksg
    username: oksg
    password: oksg

victoria-metrics-single:
  server:
    extraArgs:
      dedup.minScrapeInterval: 1ms
    persistentVolume:
      size: 5Gi
    retentionPeriod: 30d

frontend:
  enabled: true
  image:
    repository: oksg-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}

secrets:
  existingSecretName: ""
rollout:
  useConfigChecksum: true
