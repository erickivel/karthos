global:
  clusterName: default-cluster
  namespace: oksg-system
  releaseName: oksg-otel
  chartPath: ./deploy/helm/oksg-otel
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.156.0
    pullPolicy: IfNotPresent
  logging:
    format: json
    level: info

enabledSignals:
  - metric
  - trace

namespace:
  create: true
  name: oksg-system

agent:
  enabled: true
  hostNetwork: true
  logging:
    format: json
    level: info
  featureGates: []
  runtimeEnv: {}
  collectorConfig: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      kubelet_stats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        collect_all_network_interfaces:
          node: true
          pod: false
        extra_metadata_labels:
          - k8s.volume.type
        metric_groups:
          - node
          - pod
          - container
          - volume
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          memory: {}
          disk: {}
          filesystem:
            metrics:
              system.filesystem.utilization:
                enabled: true
          network: {}
          load: {}
          paging: {}
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      resource:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: insert
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
      transform/oksg-source:
        metric_statements:
          - context: datapoint
            statements:
              - 'set(datapoint.attributes["oksg_source"], "kubelet") where IsMatch(metric.name, "^k8s\\.pod\\.(cpu|memory|filesystem|network)\\.") and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "kubelet") where IsMatch(metric.name, "^k8s\\.volume\\.") and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "kubelet") where IsMatch(metric.name, "^container\\.") and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "kubelet") where (metric.name == "k8s.node.cpu.usage" or metric.name == "k8s.node.memory.working_set" or IsMatch(metric.name, "^k8s\\.node\\.(network|filesystem)\\.")) and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "host-os") where IsMatch(metric.name, "^system\\.") and datapoint.attributes["oksg_source"] == nil'
      batch: {}
    exporters:
      otlp_grpc:
        endpoint: otel-collector-gateway:4317
        tls:
          insecure: true
    service:
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers: [kubelet_stats, host_metrics]
          processors: [resource, k8s_attributes, transform/oksg-source, batch]
          exporters: [otlp_grpc]
        metrics/otlp:
          receivers: [otlp]
          processors: [resource, k8s_attributes, batch]
          exporters: [otlp_grpc]
        traces:
          receivers: [otlp]
          processors: [resource, k8s_attributes, batch]
          exporters: [otlp_grpc]
  resources: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}

gateway:
  enabled: true
  logging:
    format: json
    level: info
  featureGates:
    - -connector.spanmetrics.includeCollectorInstanceID
  runtimeEnv: {}
  collectorConfig: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8s_cluster:
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]
        allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
        metrics:
          k8s.container.storage_limit:
            enabled: false
          k8s.container.storage_request:
            enabled: false
          k8s.node.condition:
            enabled: true
          k8s.container.ready:
            enabled: true
          k8s.container.restarts:
            enabled: true
          k8s.pod.status_reason:
            enabled: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform/oksg-source:
        metric_statements:
          - context: datapoint
            statements:
              - 'set(datapoint.attributes["oksg_source"], "kube-cluster") where IsMatch(metric.name, "^k8s\\.container\\.") and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "kube-cluster") where IsMatch(metric.name, "^k8s\\.pod\\.") and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "kube-cluster") where IsMatch(metric.name, "^k8s\\.(replicaset|deployment|namespace|daemonset|statefulset|job|cronjob|hpa|resource_quota|replication_controller)\\.") and datapoint.attributes["oksg_source"] == nil'
              - 'set(datapoint.attributes["oksg_source"], "kube-cluster") where IsMatch(metric.name, "^k8s\\.node\\.(condition|allocatable|cpu\\.capacity|cpu\\.cores|cpu\\.frequency|memory\\.capacity|disk\\.capacity|network\\.bandwidth)") and datapoint.attributes["oksg_source"] == nil'
      batch: {}
    exporters:
      otlp_grpc:
        endpoint: oksg-backend:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true
    service:
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, transform/oksg-source, batch]
          exporters: [otlp_grpc]
        metrics/otlp:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc]
  replicas: 1
  service:
    type: ClusterIP
    port: 4317
    httpPort: 4318
  resources: {}

backend:
  enabled: true
  grpcEndpoint: oksg-backend:4317
  httpEndpoint: 0.0.0.0:4318
  image:
    repository: oksg-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    grpcPort: 4317
    httpPort: 4318
    healthPort: 13133
    apiPort: 8080
  statusStaleSeconds: 300
  topologyFlushInterval: "60s"
  runtimeEnv: {}
  discoveryProfile:
    enabled: false
    configMapName: oksg-discovery-profile
  resources: {}

storage:
  backend: memory
  rawStoreEnabled: false
  postgresql:
    # Set enabled=true to deploy PostgreSQL as a subchart.
    enabled: false
    # dsn overrides auto-generated DSN when provided (e.g. external PG instance).
    dsn: ""
  victoriametrics:
    # Set enabled=true to deploy VictoriaMetrics as a subchart.
    enabled: false
    # url overrides auto-generated URL when provided (e.g. external VM instance).
    url: ""

# Bitnami PostgreSQL subchart values (deployed when storage.postgresql.enabled=true).
postgresql:
  auth:
    database: oksg
    username: oksg
    password: oksg

# VictoriaMetrics single-node subchart values (deployed when storage.victoriametrics.enabled=true).
victoria-metrics-single:
  server:
    # OTLP retries preserve series labels and timestamps. Deduplicating at 1ms
    # keeps replayed samples idempotent without collapsing normal scrape data.
    extraArgs:
      dedup.minScrapeInterval: 1ms
    persistentVolume:
      size: 5Gi
    retentionPeriod: 30d

frontend:
  enabled: true
  image:
    repository: oksg-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}

secrets:
  existingSecretName: ""

rollout:
  useConfigChecksum: true
