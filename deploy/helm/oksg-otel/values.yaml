global:
  clusterName: default-cluster
  namespace: oksg-system
  releaseName: oksg-otel
  chartPath: ./deploy/helm/oksg-otel
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.111.0
    pullPolicy: IfNotPresent
  logging:
    format: json
    level: info

enabledSignals:
  - metric
  - trace

namespace:
  create: true
  name: oksg-system

agent:
  enabled: true
  logging:
    format: json
    level: info
  featureGates:
    - receiver.kubeletstats.enableCPUUsageMetrics
  runtimeEnv: {}
  collectorConfig: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
      batch: {}
    exporters:
      otlp:
        endpoint: otel-collector-gateway:4317
        tls:
          insecure: true
    service:
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers: [kubeletstats]
          processors: [k8sattributes, batch]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp]
  resources: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}

gateway:
  enabled: true
  logging:
    format: json
    level: info
  featureGates: []
  runtimeEnv: {}
  collectorConfig: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch: {}
    exporters:
      otlp:
        endpoint: oksg-backend:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true
    service:
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
  replicas: 1
  service:
    type: ClusterIP
    port: 4317
    httpPort: 4318
  resources: {}

backend:
  enabled: true
  grpcEndpoint: oksg-backend:4317
  httpEndpoint: 0.0.0.0:4318
  image:
    repository: oksg-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    grpcPort: 4317
    httpPort: 4318
    healthPort: 13133
    apiPort: 8080
  statusStaleSeconds: 300
  topologyFlushInterval: "60s"
  runtimeEnv: {}
  discoveryProfile:
    enabled: false
    configMapName: oksg-discovery-profile
  resources: {}

storage:
  backend: memory
  rawStoreEnabled: false
  postgresql:
    # Set enabled=true to deploy PostgreSQL as a subchart.
    enabled: false
    # dsn overrides auto-generated DSN when provided (e.g. external PG instance).
    dsn: ""
  victoriametrics:
    # Set enabled=true to deploy VictoriaMetrics as a subchart.
    enabled: false
    # url overrides auto-generated URL when provided (e.g. external VM instance).
    url: ""

# Bitnami PostgreSQL subchart values (deployed when storage.postgresql.enabled=true).
postgresql:
  auth:
    database: oksg
    username: oksg
    password: oksg

# VictoriaMetrics single-node subchart values (deployed when storage.victoriametrics.enabled=true).
victoria-metrics-single:
  server:
    persistentVolume:
      size: 5Gi
    retentionPeriod: 30d

frontend:
  enabled: true
  image:
    repository: oksg-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}

secrets:
  existingSecretName: ""

rollout:
  useConfigChecksum: true
