apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karthos.gatewayName" . }}-config
  namespace: {{ include "karthos.namespace" . }}
  labels:
    {{- include "karthos.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
data:
  config.yaml: |
{{ required "gateway.collectorConfig must be supplied by generated collector-plan values" .Values.gateway.collectorConfig | indent 4 }}
