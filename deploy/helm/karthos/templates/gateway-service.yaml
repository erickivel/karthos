apiVersion: v1
kind: Service
metadata:
  name: {{ include "karthos.gatewayName" . }}
  namespace: {{ include "karthos.namespace" . }}
  labels:
    {{- include "karthos.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "karthos.name" . }}
    app.kubernetes.io/component: gateway
  ports:
    - name: otlp-grpc
      port: {{ .Values.gateway.service.port }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.gateway.service.httpPort }}
      targetPort: otlp-http
