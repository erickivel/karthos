{{- if eq .Values.storage.backend "external" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "karthos.name" . }}-storage
  namespace: {{ include "karthos.namespace" . }}
  labels:
    {{- include "karthos.componentLabels" (dict "context" . "component" "storage") | nindent 4 }}
type: Opaque
stringData:
  postgres-dsn: {{ include "karthos.postgresDSN" . | quote }}
{{- end }}
