services:
  oksg-backend:
    build:
      context: .
      dockerfile: deploy/images/backend/Dockerfile
    ports:
      - "18081:8080"

  oksg-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET:-http://host.docker.internal:18081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
