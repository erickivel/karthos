services:
  oksg-backend:
    build:
      context: .
      dockerfile: deploy/images/backend/Dockerfile
    ports:
      - "18081:8080"

  oksg-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web/public:/app/public
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET:-http://host.docker.internal:18081}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  oksg-playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    environment:
      - PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://host.docker.internal:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  web-node-modules:
