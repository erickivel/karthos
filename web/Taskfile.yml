version: "3"

tasks:
  dev:
    desc: Start the Dockerized frontend development server with HMR on port 5173
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose up karthos-frontend --build

  check:
    desc: Build shared dependencies, typecheck, lint, and build the production frontend image
    cmds:
      - task: prepare
      - task: typecheck
      - task: lint
      - task: image-build

  prepare:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose build karthos-frontend

  image-build:
    internal: true
    dir: '{{.ROOT_DIR}}/web'
    cmds:
      - docker build -t karthos-frontend:latest .

  typecheck:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose run --rm --no-deps karthos-frontend npx tsc --noEmit

  lint:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose run --rm --no-deps karthos-frontend npm run lint
