name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  GO_VERSION: "1.23.4"
  TASK_VERSION: "3.40.1"
  GOLANGCI_LINT_VERSION: "v1.61.0"
  GOVULNCHECK_VERSION: "v1.1.4"
  GOSEC_VERSION: "v2.21.4"

jobs:
  prepare-ci-cache:
    name: Prepare CI Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}
          install-golangci-lint: "true"
          install-security-tools: "true"

      - name: Warm Go module cache
        run: go mod download
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [prepare-ci-cache]
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}
          install-golangci-lint: "true"

      - name: Run lint
        run: task lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: [prepare-ci-cache]
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}

      - name: Check formatting
        run: task fmt:check

  vet:
    name: Vet
    runs-on: ubuntu-latest
    needs: [prepare-ci-cache]
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}

      - name: Run vet
        run: task vet

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [prepare-ci-cache, lint, format-check, vet]
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}

      - name: Run tests
        run: task test:race

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}

      - name: Build binaries
        run: task build:check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Shared setup
        uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
          task-version: ${{ env.TASK_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}
          govulncheck-version: ${{ env.GOVULNCHECK_VERSION }}
          gosec-version: ${{ env.GOSEC_VERSION }}
          install-security-tools: "true"

      - name: Run security scan
        run: task security
